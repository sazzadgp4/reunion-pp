<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IUBAT EEE Alumni Reunion 2026 – Profile Picture Maker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#eef5fb;--ink:#1d3470;--muted:#4c5f86;--orange:#f47b29;--card:#fff;--line:#c9d9ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1830;--ink:#e8eefc;--muted:#9fb1d6;--card:#14223f;--line:#2a3c63}}
:root[data-theme="dark"]{--bg:#0d1830;--ink:#e8eefc;--muted:#9fb1d6;--card:#14223f;--line:#2a3c63}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:28px 18px 40px}
h1{font-family:Fraunces,Georgia,serif;font-weight:900;font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.1;margin:0 0 8px}
p.lead{margin:0 0 20px;color:var(--muted)}
.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
canvas{display:block;width:100%;height:auto;aspect-ratio:1/1;border-radius:8px;touch-action:none;cursor:grab}
canvas.empty{cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
button,label.btn{font:600 1rem Figtree,sans-serif;border-radius:10px;padding:12px 18px;border:2px solid var(--orange);cursor:pointer;background:transparent;color:var(--ink);text-align:center}
.primary{background:var(--orange);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,label.btn:focus-within,input[type=range]:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.zoom{display:flex;align-items:center;gap:12px;margin-top:14px;color:var(--muted)}
.zoom input{flex:1;accent-color:var(--orange)}
.hint{font-size:.9rem;color:var(--muted);margin-top:12px}
.hint[hidden]{display:none}
</style>
</head>
<body>
<main>
<h1>Make your profile picture for IUBAT EEE Alumni Reunion 2026</h1>
<p class="lead">Upload a photo of yourself, position it inside the circle, then download it with the reunion frame.</p>
<div class="stage"><canvas id="c" width="1080" height="1080" class="empty" aria-label="Profile picture preview"></canvas></div>
<div class="zoom"><span>Zoom</span><input id="z" type="range" min="1" max="3" step="0.01" value="1" disabled aria-label="Zoom"></div>
<div class="row">
<label class="btn primary" id="upl">Upload your image<input id="f" type="file" accept="image/*"></label>
<button id="dl" disabled>Download picture</button>
</div>
<p class="hint" id="h">Drag the photo to move it. Use the slider to zoom.</p>
<p class="hint" id="e" hidden>That file couldn’t be read as an image. Try a JPG or PNG.</p>
</main>

const S=1080, CX=S*0.5, CY=S*0.416, R=S*0.325;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const z=document.getElementById('z'), dl=document.getElementById('dl'), f=document.getElementById('f');
const frame=new Image(); let img=null, base=1, zoom=1, ox=0, oy=0, ready=false;
frame.onload=()=>{ready=true;draw(true)}; frame.src=FRAME_SRC;

function draw(preview){
  if(!ready) return;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,S,S);
  if(img){
    const s=base*zoom, w=img.width*s, h=img.height*s;
    ctx.drawImage(img, CX+ox-w/2, CY+oy-h/2, w, h);
  }
  ctx.drawImage(frame,0,0,S,S);
  if(!img && preview){
    ctx.fillStyle='rgba(29,52,112,.55)'; ctx.font='600 44px Figtree, sans-serif'; ctx.textAlign='center';
    ctx.fillText('Your photo goes here',CX,CY+10);
  }
}
f.addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file) return;
  const url=URL.createObjectURL(file), im=new Image();
  im.onload=()=>{
    img=im; base=Math.max(2*R/im.width,2*R/im.height); zoom=1; ox=oy=0;
    z.value=1; z.disabled=false; dl.disabled=false; cv.classList.remove('empty');
    document.getElementById('e').hidden=true; draw(true);
  };
  im.onerror=()=>{document.getElementById('e').hidden=false};
  im.src=url;
});
z.addEventListener('input',()=>{zoom=+z.value;draw(true)});
let drag=null;
cv.addEventListener('pointerdown',e=>{if(!img)return;cv.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,ox,oy};cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{
  if(!drag)return; const k=S/cv.getBoundingClientRect().width;
  ox=drag.ox+(e.clientX-drag.x)*k; oy=drag.oy+(e.clientY-drag.y)*k; draw(true);
});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{drag=null;cv.style.cursor=''}));
cv.addEventListener('wheel',e=>{if(!img)return;e.preventDefault();zoom=Math.min(3,Math.max(1,zoom-e.deltaY*0.001));z.value=zoom;draw(true)},{passive:false});
dl.addEventListener('click',()=>{
  draw(false);
  cv.toBlob(b=>{
    const a=document.createElement('a'); a.href=URL.createObjectURL(b);
    a.download='iubat-eee-alumni-reunion-2026.png'; document.body.appendChild(a); a.click(); a.remove();
    draw(true);
  },'image/png');
});
